# Hearthlands CI: builds this workspace (the game's code with Hydro, Oxygen and Runtime) against the Hydro commit in
# engine.lock, on a GitHub-hosted Windows machine, and checks the game's generated reflection, code conventions,
# project and rule tests with Hydro's tools. Hydro is public, so it is checked out next to this repository.
#
# engine.lock is exact here: the job fails when the checked-out Hydro isn't that commit. Locally a different
# Hydro is only a warning (premake prints it), since engine and game often change together.

name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with Hydro's scripts/SetupVulkan.py and scripts/SetupPremake.py.
  VULKAN_SDK_VERSION: "1.3.296.0"
  PREMAKE_VERSION: "5.0.0-beta7"
  HYDRO_REPOSITORY: joelnl74/Hydro

jobs:
  build:
    name: Windows MSVC (${{ matrix.config }})
    runs-on: windows-2025
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out Hearthlands
        uses: actions/checkout@v5
        with:
          path: Hearthlands
          fetch-depth: 1

      - name: Read engine.lock
        id: engine
        shell: pwsh
        run: |
          $commit = (Get-Content Hearthlands\engine.lock -Raw).Trim()
          if ($commit -notmatch '^[0-9a-f]{7,40}$') { throw "engine.lock must hold a Hydro commit, not '$commit'" }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out Hydro at engine.lock
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HYDRO_REPOSITORY }}
          ref: ${{ steps.engine.outputs.commit }}
          path: Hydro
          submodules: recursive
          fetch-depth: 0

      - name: Hydro is exactly engine.lock
        shell: pwsh
        run: |
          $want = "${{ steps.engine.outputs.commit }}"
          $have = (git -C Hydro rev-parse HEAD).Trim()
          if (-not $have.StartsWith($want)) { throw "Hydro is at $have, engine.lock wants $want" }
          Write-Output "Hydro $have"

      # ---- Vulkan SDK (cached; the Debug build links the SDK's debug SPIRV-Cross libraries) -----
      - name: Restore the Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-debug-v1

      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$ver"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-$ver-Installer.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $installer
          # The installer is a GUI program: Start-Process -Wait, not &, so the step waits for it.
          $process = Start-Process -FilePath $installer -Wait -PassThru -NoNewWindow -ArgumentList @(
            "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command",
            "install", "com.lunarg.vulkan.debug")
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($process.ExitCode)" }
          foreach ($file in @("Include\vulkan\vulkan.h", "Lib\vulkan-1.lib", "Lib\spirv-cross-cored.lib", "Bin\glslc.exe")) {
            if (-not (Test-Path (Join-Path $root $file))) { throw "Vulkan SDK install is missing $file" }
          }

      - name: Use the Vulkan SDK
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ---- Premake (Hydro's; not in its repository) ----------------------------------------------
      - name: Restore premake
        id: premake-cache
        uses: actions/cache@v4
        with:
          path: Hydro\vendor\premake\bin
          key: premake-${{ env.PREMAKE_VERSION }}-windows

      - name: Download premake
        if: steps.premake-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:PREMAKE_VERSION
          $zip = Join-Path $env:RUNNER_TEMP "premake.zip"
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v$ver/premake-$ver-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath Hydro\vendor\premake\bin -Force
          if (-not (Test-Path Hydro\vendor\premake\bin\premake5.exe)) { throw "premake5.exe not found in the premake zip" }

      # ---- Python launcher: Oxygen's pre-build step runs the reflection generator with 'py' ------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make sure 'py' exists
        shell: pwsh
        run: |
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
            $shim = Join-Path $env:RUNNER_TEMP "pyshim"
            New-Item -ItemType Directory -Force -Path $shim | Out-Null
            Set-Content -Path (Join-Path $shim "py.cmd") -Value "@python %*"
            $shim | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      # ---- Build ---------------------------------------------------------------------------------
      - name: Build (${{ matrix.config }})
        shell: cmd
        run: call Hearthlands\scripts\Build.bat ${{ matrix.config }} --no-pause

      - name: Report errors and warnings
        if: always()
        shell: pwsh
        run: |
          $config = "${{ matrix.config }}"
          $logDirs = @("Hearthlands\bin\logs")
          $workspace = ($env:GITHUB_WORKSPACE -replace '/', '\').TrimEnd('\') + '\'
          # MSVC: path(line[,col]): error C1234: message   (linker/MSBuild lines have no line number)
          $pattern = '^\s*(?<file>[^(]+?)\((?<line>\d+)(,(?<col>\d+))?\)\s*:\s*(fatal )?(?<kind>error|warning)\s+(?<code>\w+)\s*:\s*(?<msg>.*?)(\s*\[[^\]]+\])?$'
          $errors = @(); $warnings = @()
          foreach ($dir in $logDirs) {
            $errLog = "$dir\Build-$config-errors.log"; $warnLog = "$dir\Build-$config-warnings.log"
            if (Test-Path $errLog) { $errors += @(Get-Content $errLog | Where-Object { $_ -match ': (fatal )?error ' }) }
            if (Test-Path $warnLog) { $warnings += @(Get-Content $warnLog | Where-Object { $_ -match ': warning ' }) }
          }
          $errors = @($errors | Sort-Object -Unique); $warnings = @($warnings | Sort-Object -Unique)
          foreach ($line in $errors) {
            if ($line -match $pattern) {
              $file = $Matches.file.Trim() -replace [regex]::Escape($workspace), ''
              $where = "file=$($file -replace '\\', '/'),line=$($Matches.line)"
              if ($Matches.col) { $where += ",col=$($Matches.col)" }
              Write-Output "::error $where,title=$($Matches.code)::$($Matches.msg)"
            } else {
              Write-Output "::error::$($line.Trim())"
            }
          }
          $summary = @("### $config build", "", "- Errors: $($errors.Count)", "- Warnings: $($warnings.Count) (unique lines)")
          if ($errors.Count -gt 0) {
            $summary += @("", "<details><summary>Errors</summary>", "", '```')
            $summary += ($errors | Select-Object -First 100 | ForEach-Object { $_.Replace($workspace, '') })
            $summary += @('```', "</details>")
          }
          if ($warnings.Count -gt 0) {
            $summary += @("", "<details><summary>Warnings (first 100)</summary>", "", '```')
            $summary += ($warnings | Select-Object -First 100 | ForEach-Object { $_.Replace($workspace, '') })
            $summary += @('```', "</details>")
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config }}
          path: Hearthlands/bin/logs/
          retention-days: 14
          if-no-files-found: ignore

  checks:
    name: Checks (generated files, conventions, project, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Hearthlands
        uses: actions/checkout@v5
        with:
          path: Hearthlands
          fetch-depth: 1

      - name: Read engine.lock
        id: engine
        run: echo "commit=$(tr -d '[:space:]' < Hearthlands/engine.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out Hydro at engine.lock
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HYDRO_REPOSITORY }}
          ref: ${{ steps.engine.outputs.commit }}
          path: Hydro
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reflection is up to date
        run: python Hydro/Tools/ReflectionGenerator/generate_reflection.py Hydro --check --workspace Hearthlands

      - name: Code conventions
        run: python Hydro/scripts/lint_conventions.py Hearthlands/Game/src

      - name: Project validation
        run: |
          python -m pip install --quiet pyyaml
          python Hydro/scripts/validate_project.py --workspace Hearthlands

      - name: Rule tests (with Hydro's data tests)
        run: bash Hearthlands/scripts/check.sh --tests
